schema_version = 1
name    = "claude"
command = "claude"

[headless]
args   = ["-p", "--output-format", "stream-json", "--verbose"]
prompt = "stdin"
parser = "claude-stream-json"

[options]
model = ["--model", "{value}"]

[permissions]
auto = ["--permission-mode", "auto"]
skip = ["--dangerously-skip-permissions"]

[resume]
args = ["--resume", "{conversation_id}"]

# A remote bridge (`fastener run claude --remote`): `claude remote-control`
# runs headless and is driven from claude.ai/code or the mobile app.
# remote-control takes --permission-mode (acceptEdits, auto,
# bypassPermissions, default, dontAsk, plan) but not
# --dangerously-skip-permissions, so skip maps to bypassPermissions.
[remote]
args              = ["remote-control", "--name", "{name}"]
parser            = "claude-remote"
untrusted_pattern = '(?i)workspace not trusted'
untrusted_hint    = "fastener authorize claude-folder-trust {dir}"
dedupe_frames     = true

[remote.permissions]
skip = ["--permission-mode", "bypassPermissions"]

# An interactive session (`fastener run claude --interactive`): Claude Code's
# own TUI on a pty the monitor owns; `fastener attach` connects to it. An
# initial prompt is passed as the positional prompt, after "--" (Claude Code
# 2.1.322 submits it as the first message).
#
# The conversation is known exactly: Fastener passes a new UUID with
# --session-id (it works together with --remote-control), and Claude writes
# its transcript to <config home>/projects/<cwd key>/<uuid>.jsonl at the first
# message; the claude-transcripts finder confirms that file for status
# conversation_id.
[interactive]
args       = []
prompt     = "arg"
session_id = ["--session-id", "{session_id}"]
finder     = "claude-transcripts"

# `run claude --interactive --remote`: the same TUI with Remote Control on,
# so it can also be driven from claude.ai/code or the mobile app. Claude
# prints "/remote-control is active · Continue here, on your phone, or at
# https://claude.ai/code/session_…" (an OSC 8 link, redrawn several times).
# The TUI draws spaces as cursor movements, so the pattern names the ID's
# characters instead of relying on \S+. In a folder whose trust dialog has
# not been accepted, the TUI shows that dialog and waits; untrusted_pattern
# matches the dialog itself, its heading ("Quick safety check: Is this a
# project you created or one you trust?") and then its option "Yes, I trust
# this folder", so a prompt that merely quotes the question does not trip it
# (fastener also removes the prompt's own text before matching).
[interactive.remote]
args              = ["--remote-control", "{name}"]
url_pattern       = 'https://claude\.ai/code/session_[A-Za-z0-9_-]+'
untrusted_pattern = '(?is)quick\s*safety\s*check\b.{0,1000}?\byes,\s*i\s*trust\s*this\s*folder'
untrusted_hint    = "fastener authorize claude-folder-trust {dir}"

[check]
version_args = ["--version"]
diagnose = [
  { match = '(?i)not logged in|please run /login|invalid api key|authentication_error|oauth token has expired', hint = "auth: run `claude` interactively and log in (/login)" },
  { match = '(?i)workspace not trusted', hint = "untrusted folder: authorize it with `fastener authorize claude-folder-trust <dir>`, or run `claude` there once and accept the trust dialog" },
  { match = '(?i)not_found_error|model[^\n]{0,40}\b(not found|does not exist|not available)\b', hint = "model unavailable: pass a valid --model" },
]
