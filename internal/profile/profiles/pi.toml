schema_version = 1
name    = "pi"
command = "pi"

# Pi has no permission system, so only "skip" is defined, and it is this
# profile's default level. An explicit --permissions auto is still an error:
# mapping "auto" to nothing would be a silent fallback.
default_permissions = "skip"

[headless]
args   = ["-p", "--mode", "json"]
# Fastener appends "--" and then the prompt. Unverified: pi may treat a prompt
# starting with "@" as a file include; revisit in v0.2.
prompt = "arg"
parser = "pi-json"

[options]
model = ["--model", "{value}"]

[permissions]
skip = []

[check]
version_args = ["--version"]
# The first matching entry wins: keep the specific ones first. Pi exits 0 and
# warns on stderr when a provider does not offer the requested model.
diagnose = [
  { match = '(?i)model "[^"]+" not found for provider', hint = "model not offered by this provider (pi fell back to a custom model id)" },
  { match = '(?i)(model|no model)[^\n]{0,40}(not found|unavailable|does not exist|no longer)|\b(status|http)\b[^\n]{0,20}\b404\b', hint = "model unavailable: pass --model, or update pi's default model" },
  { match = '(?i)no api key|missing credentials|not authenticated|\b(status|http)\b[^\n]{0,20}\b401\b', hint = "auth: check `pi auth` for the provider" },
]
