schema_version = 1
name    = "codex"
command = "codex"

# --skip-git-repo-check: Fastener sessions name their cwd explicitly; the repo
# check is an interactive guard and would fail `fastener check` in a temp dir.
[headless]
args   = ["exec", "--json", "--skip-git-repo-check"]
prompt = "stdin"
parser = "codex-jsonl"

# An interactive session (`fastener run codex --interactive`): the Codex TUI
# on a pty (codex-cli 0.167.0 starts cleanly there). An initial prompt is the
# positional [PROMPT], after "--". Remote control for Codex is separate (#56).
[interactive]
args   = []
prompt = "arg"

[options]
model = ["--model", "{value}"]

[permissions]
auto = ["--approve-for-me"]
skip = ["--dangerously-bypass-approvals-and-sandbox"]

[check]
version_args = ["--version"]
diagnose = [
  { match = '(?i)not logged in|please (run )?`?codex login|\b401 unauthorized\b|\bunauthorized\b[^\n]{0,20}\b(token|api key|login)\b|(\b(status|http)\b[^\n]{0,20}\b401\b)', hint = "auth: run `codex login`" },
  { match = '(?i)\bmodel\b[^\n]{0,40}\bis not supported\b', hint = "model not offered for this Codex account" },
  { match = '(?i)model[^\n]{0,40}\b(not found|does not exist|not supported)\b', hint = "model unavailable: pass a valid --model" },
]
