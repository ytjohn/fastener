name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - run: go vet ./...
      - run: go test -race -count=1 -v ./...
        # macOS lifecycle tests have never run; v0.2 hardens them and removes this.
        continue-on-error: ${{ matrix.os == 'macos-latest' }}
